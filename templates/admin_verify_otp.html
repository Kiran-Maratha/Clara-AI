{% extends "admin_base.html" %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-admin-dark p-6 text-center">
            <h2 class="text-white font-serif text-3xl font-bold">Admin Portal</h2>
            <p class="text-slate-400 text-sm mt-2 font-medium">Verify Identity</p>
        </div>
        <div class="p-8">
            <p class="text-xs md:text-sm text-slate-500 font-medium mb-4 text-center">We securely sent a 6-digit initialization code to your email.</p>
            {% if error %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 flex items-center">
                <span class="material-symbols-outlined mr-2 text-[18px]">error</span>
                {{ error }}
            </div>
            {% endif %}
            <form action="{{ url_for('admin.verify_otp') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wide text-center mb-1">Authentication Code</label>
                    <input type="text" name="otp" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-admin-accent transition placeholder-slate-400 text-center text-2xl tracking-[0.5em] font-mono" placeholder="123456" maxlength="6" autofocus>
                </div>
                <button type="submit" class="w-full bg-admin-accent hover:bg-indigo-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 mt-6">Verify & Login</button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-xs text-slate-500 font-medium">
                    Didn't receive code? <a href="{{ url_for('admin.login') }}" class="text-admin-accent font-bold hover:underline">Return to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
