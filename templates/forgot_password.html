{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-[#f8fafc] dark:bg-[#0d1117] flex items-center justify-center p-4 relative overflow-hidden transition-colors">
    <div class="relative w-full max-w-md z-10 mx-auto">
        <div class="bg-white dark:bg-[#161b22] rounded-[2rem] p-8 md:p-12 shadow-2xl border border-slate-100 dark:border-[#1d232c] transition-colors relative overflow-hidden">
            <div class="mb-10 w-full text-center">
                <a href="{{ url_for('auth.login') }}" class="inline-flex w-16 h-16 rounded-2xl bg-brand-dark dark:bg-blue-500 items-center justify-center text-white shrink-0 shadow-lg shadow-blue-900/20 mb-6 mx-auto cursor-pointer hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-[32px]">lock_reset</span>
                </a>
                <h1 class="font-serif text-3xl md:text-4xl text-brand-dark dark:text-white font-bold mb-3 tracking-tight">Recover Password</h1>
                <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 font-medium">Enter your email and we'll securely verify your identity with a 6-digit OTP code.</p>
                {% if error %}
                <p class="text-[11px] md:text-xs text-red-500 bg-red-500/10 py-2 mt-4 rounded-lg font-bold">{{ error }}</p>
                {% endif %}
            </div>
            <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide text-center">Account Email</label>
                    <input type="email" name="email" placeholder="hello@example.com" class="w-full px-4 py-3 md:py-4 mt-2 rounded-xl md:rounded-2xl bg-slate-50 dark:bg-[#0d1117] border border-slate-200 dark:border-[#212833] text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-dark/20 dark:focus:ring-blue-500/50 transition placeholder-slate-400 dark:placeholder-slate-500 text-center text-base" required>
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-brand-dark dark:bg-blue-500 text-white font-bold text-[15px] py-4 rounded-xl md:rounded-2xl hover:bg-brand-light dark:hover:bg-blue-600 transition shadow-lg shadow-blue-900/20 active:scale-[0.98]">
                        Send Reset Code
                    </button>
                </div>
            </form>
            <div class="mt-8 text-center">
                <p class="text-[11px] md:text-xs text-slate-500 dark:text-slate-400 font-medium">
                    Remembered your password? <a href="{{ url_for('auth.login') }}" class="text-brand-dark dark:text-blue-400 font-bold hover:underline">Reunite connection</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
