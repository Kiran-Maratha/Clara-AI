{% extends "admin_base.html" %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-admin-dark p-6 text-center">
            <h2 class="text-white font-serif text-3xl font-bold">Admin Portal</h2>
            <p class="text-slate-400 text-sm mt-2 font-medium">Clara AI Management</p>
        </div>
        <div class="p-8">
            {% if error %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 flex items-center">
                <span class="material-symbols-outlined mr-2 text-[18px]">error</span>
                {{ error }}
            </div>
            {% endif %}
            <form action="{{ url_for('admin.login') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-admin-accent transition" placeholder="admin@domain.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-admin-accent transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-admin-accent hover:bg-indigo-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 mt-6">Login to Portal</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
