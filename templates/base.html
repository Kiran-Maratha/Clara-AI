<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara AI - IT Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script>
        // Use inline checking to prevent flash of unstyled content
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // Sidebar preference - apply early to avoid flicker
        if (localStorage.sidebarCollapsed === 'true') {
            document.documentElement.classList.add('sidebar-collapsed');
        }

    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            light: '#f8fafc',
                            blue: '#3b82f6',
                            bg: '#f0f4f8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <!-- Markdown and Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="text-slate-800 dark:text-slate-200 antialiased min-h-screen">
    {% block content %}{% endblock %}
    <!-- Logout Modal -->
    <div id="logout-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0 flex">
        <div class="bg-white dark:bg-[#161b22] w-full max-w-sm rounded-[2rem] shadow-2xl p-8 border border-slate-200 dark:border-[#1d232c] transform scale-95 transition-transform duration-300">
            <div class="text-center">
                <div class="w-16 h-16 bg-red-50 dark:bg-red-500/10 rounded-2xl flex items-center justify-center text-red-500 mx-auto mb-6">
                    <span class="material-symbols-outlined text-[32px]">logout</span>
                </div>
                <h2 class="font-serif text-2xl text-brand-dark dark:text-white font-bold mb-2 tracking-tight">Log Out</h2>
                <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 leading-relaxed">Are you sure you want to log out?</p>
                
                <div class="space-y-3">
                    <a id="confirm-logout" href="{{ url_for('auth.logout') }}" class="block w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-red-500/20 active:scale-[0.98] text-sm">Log Out</a>
                    <button id="cancel-logout" class="block w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold py-3.5 rounded-2xl transition hover:bg-slate-200 dark:hover:bg-slate-700 text-sm">Return</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Chat Modal -->
    <div id="delete-chat-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0 flex">
        <div class="bg-white dark:bg-[#161b22] w-full max-w-sm rounded-[2rem] shadow-2xl p-8 border border-slate-200 dark:border-[#1d232c] transform scale-95 transition-transform duration-300">
            <div class="text-center">
                <div class="w-16 h-16 bg-red-50 dark:bg-red-500/10 rounded-2xl flex items-center justify-center text-red-500 mx-auto mb-6">
                    <span class="material-symbols-outlined text-[32px]">delete_forever</span>
                </div>
                <h2 class="font-serif text-2xl text-brand-dark dark:text-white font-bold mb-2 tracking-tight">Delete Chat?</h2>
                <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 font-medium mb-8 leading-relaxed">This will permanently remove this conversation history. This action cannot be undone.</p>
                
                <div class="space-y-3">
                    <button id="confirm-delete-chat" class="block w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-red-500/20 active:scale-[0.98] text-sm">Delete Forever</button>
                    <button id="cancel-delete-chat" class="block w-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold py-3.5 rounded-2xl transition hover:bg-slate-200 dark:hover:bg-slate-700 text-sm">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
